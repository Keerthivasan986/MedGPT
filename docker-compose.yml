services:
  api:
    build: ./Backend
    ports:
      - "4000:4000"
    env_file:
      - ./Backend/.env
    environment:
      CLIENT_ORIGIN: http://localhost:5173

  web:
    build: ./Frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - api
